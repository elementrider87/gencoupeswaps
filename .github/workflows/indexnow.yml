name: Notify search engines (IndexNow)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Give Cloudflare time to build and publish the new version first
      - run: sleep 240
      - run: node scripts/indexnow.mjs
